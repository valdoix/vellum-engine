.vellum{position:relative;isolation:isolate;min-height:700px;padding:18px;border:1px solid var(--line);background:var(--deep);overflow:hidden;box-shadow:0 28px 80px #0008}.vellum:before,.vellum:after{content:"";position:absolute;z-index:-1;pointer-events:none}.windowbar{min-height:66px;display:flex;align-items:center;gap:14px;padding:12px 18px;margin-bottom:16px;border:1px solid var(--line);background:#0b0710aa}.brand{font:italic 700 25px Georgia,serif;color:var(--gold);margin-right:auto}.sealmark{width:34px;height:34px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-weight:900;transform:rotate(45deg);box-shadow:0 0 20px var(--purple)}.sealmark span{transform:rotate(-45deg)}.tool{width:35px;height:35px;display:grid;place-items:center;border:1px solid var(--line);background:#ffffff0a;color:var(--ink);border-radius:10px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}.tabs span{padding:7px 13px;border:1px solid var(--line);color:var(--muted);background:#ffffff08}.tabs span:first-child{color:var(--deep);background:var(--green);font-weight:800}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:17px;align-items:start}.card{position:relative;min-width:0;padding:20px;color:var(--ink);background:var(--paper);border:1px solid var(--line);overflow:hidden;box-shadow:0 14px 25px #0005}.card.now{grid-column:span 4;min-height:292px}.card.cast{grid-column:span 4;min-height:292px}.card.bond{grid-column:span 4;min-height:292px}.card.chronicle{grid-column:span 7;min-height:250px}.card.vault{grid-column:span 5;min-height:250px}.card h3{font:600 24px/1.08 Georgia,serif;margin:8px 0 12px}.card p{margin:9px 0;color:var(--muted)}.card .micro{color:var(--green)}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.chip{padding:3px 8px;border:1px solid var(--line);background:#ffffff09;font:700 9px/1.4 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}.avatar{width:62px;height:74 /* Focused atelier pass: three fully distinct material and silhouette systems. */
/* Rococo Conservatory — pastel porcelain, shell cartouches, ribbons, and cabinet work. */
.rococo{--pink:#ffacd4;--green:#acefc3;--blue:#b8dcff;--purple:#d7b9ff;--gold:#ffe9b5;--paper:#342333f2;--deep:#17121a;--ink:#fff9f2;--muted:#f0dce7;--line:#ffe9b56b}
.rococo .vellum{border:3px double var(--gold);border-radius:42px 16px 42px 16px;background:radial-gradient(ellipse at 7% 4%,#acefc34d,transparent 25%),radial-gradient(ellipse at 94% 90%,#ffacd44a,transparent 29%),linear-gradient(145deg,#211725,#17121a 55%,#1f1822)}
.rococo .vellum:before{inset:9px;border:1px solid #ffe9b566;border-radius:34px 11px 34px 11px;box-shadow:inset 0 0 34px #ffacd412}
.rococo .vellum:after{width:220px;height:220px;right:-72px;top:70px;border:22px double #acefc312;border-radius:50%;transform:rotate(18deg)}
.rococo .windowbar{border-radius:42px 12px 42px 12px;border:2px double var(--gold);background:linear-gradient(90deg,#ffacd426,#acefc326,#d7b9ff20),#2b1e2a}
.rococo .tabs span{border-radius:18px 5px 18px 5px;background:#fff5f00b}.rococo .tabs span:first-child{background:linear-gradient(90deg,var(--pink),var(--green));color:#3b2030}
.rococo .card{border:2px solid var(--gold);background:radial-gradient(circle at 13% 8%,#acefc324,transparent 28%),linear-gradient(135deg,#ffacd41c,#d7b9ff16 55%,#acefc31a),#302130;box-shadow:inset 0 0 0 5px #fff7e908,inset 0 0 0 6px #ffe9b52e,0 15px 28px #09060966}
.rococo .card:before{content:"";position:absolute;inset:8px;border:1px solid #ffe9b548;border-radius:inherit;pointer-events:none}
.rococo .card:after{content:"❦";right:14px;top:8px;font:25px Georgia;color:var(--green);text-shadow:0 0 14px #acefc388}
.rococo .now{border-radius:82px 82px 22px 22px;padding:42px 25px 22px;border-top-width:6px;background:radial-gradient(ellipse at 50% 0,#ffacd43e,transparent 43%),#302130}
.rococo .now:after{content:"❧  ✦  ❧";left:0;right:0;top:8px;text-align:center;letter-spacing:7px;color:var(--pink)}
.rococo .cast{border-radius:46% 46% 25px 25px;padding:40px 25px 22px;outline:1px solid #acefc34c;outline-offset:-12px;background:radial-gradient(ellipse at 50% 5%,#acefc338,transparent 48%),#302130}
.rococo .cast:after{content:"✿";left:50%;right:auto;top:8px;transform:translateX(-50%);color:var(--green)}

.candy .vault:after{content:"STABLE COMPOUNDS";right:16px;top:12px}.candy .folio{border:1px solid var(--purple);border-radius:7px 23px 7px 23px;background:#9d4dff0d}.candy .folio-icon{border-radius:50% 50% 45% 45%;background:linear-gradient(var(--pink),var(--purple));box-shadow:0 0 13px #ff2fbd88}.candy .chip{border-color:#40ff8788;background:#40ff870d;box-shadow:0 0 8px #40ff872c}.candy .meter i{background:linear-gradient(90deg,var(--pink),var(--gold),var(--green),var(--blue),var(--purple));box-shadow:0 0 10px var(--blue)}

/* Dream Quilt Palace — appliqué patches, lockets, seams, and gently moving cloth. */
.quilt{--pink:#f08fc8;--green:#8fdab0;--blue:#87bfe8;--purple:#aa89d4;--gold:#f1d28a;--paper:#2b1d35f2;--deep:#120e1b;--ink:#fff7f2;--muted:#ddcedf;--line:#f1d28a88}

.quilt .vellum:before{inset:9px;border:2px dashed #f1d28a73;border-radius:15px;animation:quiltSeam 9s linear infinite}
.quilt .vellum:after{width:180px;height:180px;right:-55px;bottom:-60px;border:18px double #f08fc81f;border-radius:46% 54% 48% 52%;animation:quiltMoon 8s ease-in-out infinite}
.quilt .windowbar{border:3px double var(--gold);border-radius:18px 42px 18px 42px;background:linear-gradient(135deg,#f08fc822,#8fdab01c,#87bfe81e,#aa89d427),#25182d;box-shadow:inset 0 0 0 5px #f08fc812}
.quilt .tabs span{border:2px dashed #f1d28a77;border-radius:13px 13px 5px 5px}.quilt .tabs span:first-child{background:linear-gradient(90deg,var(--green),var(--blue));color:#17201d}
.quilt .card{border:3px dashed var(--gold);background:linear-gradient(135deg,#f08fc818 25%,transparent 25%) 0 0/34px 34px,linear-gradient(315deg,#87bfe814 25%,transparent 25%) 0 0/34px 34px,#291b32;box-shadow:inset 0 0 0 6px #aa89d419,0 13px 24px #0006;animation:quiltBreathe 7s ease-in-out infinite}
.quilt .card:before{content:"";position:absolute;inset:9px;border:1px dashed #fff1c35e;border-radius:inherit;pointer-events:none;background:linear-gradient(90deg,#f08fc80d,#8fdab00d,#87bfe80d,#aa89d40d);background-size:180% 100%;animation:quiltThread 11s ease-in-out infinite}
.quilt .card:after{content:"✿";right:12px;bottom:8px;color:var(--pink);text-shadow:0 0 9px #f08fc866;animation:quiltButton 5s ease-in-out infinite}
.quilt .now{border-radius:16px 68px 16px 68px;border-left:8px solid var(--pink);background:linear-gradient(135deg,#f08fc82b,#aa89d417 52%,#87bfe817),#291b32;animation-delay:-1s}
.quilt .now:after{content:"✦ PATCH 12";font:800 8px ui-monospace,monospace;letter-spacing:.14em}
.quilt .cast{border-radius:48% 48% 24px 24px;padding:41px 25px 22px;border-top:7px double var(--blue);background:radial-gradient(ellipse at 50% 0,#87bfe837,transparent 53%),#291b32;animation-delay:-2.5s}
.quilt .cast:after{content:"●";left:50%;right:auto;top:13px;bottom:auto;transform:translateX(-50%);color:var(--green)}
.quilt .bond{border-radius:50px 15px 50px 15px;border-inline:7px double var(--purple);background:linear-gradient(90deg,#f08fc81d 0 48.7%,#f1d28a77 49.3% 50.7%,#8fdab01d 51.3%),#291b32;animation-delay:-4s}
.quilt .bond:after{content:"∞";left:50%;right:auto;top:11px;bottom:auto;transform:translateX(-50%);font:24px Georgia;color:var(--gold)}
.quilt .chronicle{border-radius:34px 8px 34px 8px;border-block:6px double var(--green);background:repeating-linear-gradient(90deg,#87bfe814 0 26px,#aa89d414 26px 52px),#291b32;animation-delay:-3s}
.quilt .chronicle:after{content:"RUNNING STITCH";right:16px;top:11px;bottom:auto;font:800 8px ui-monospace,monospace;letter-spacing:.15em;color:var(--blue)}
.quilt .vault{border-radius:12px 12px 72px 72px;border-top:8px double var(--pink);background:linear-gradient(180deg,#f08fc824,#aa89d416 45%,#8fdab017),#291b32;animation-delay:-5s}
.quilt .vault:after{content:"MEMORY POCKET";right:16px;top:13px;bottom:auto;font:800 8px ui-monospace,monospace;letter-spacing:.13em;color:var(--green)}
.quilt .avatar{border-radius:50% 50% 18px 18px;border:3px double var(--blue);background:radial-gradient(circle at 50% 30%,#f08fc838,transparent 44%),#211728}.quilt .folio{border:2px dashed #f1d28a66;border-radius:8px 25px 8px 25px;background:#fff5dc08}.quilt .folio-icon{border-radius:10px 28px 10px 28px;background:linear-gradient(135deg,var(--purple),var(--blue))}
.quilt .floating{border:2px dashed var(--pink);border-radius:12px 30px 12px 30px;background:#201628ef;animation:quiltFloat 6s ease-in-out infinite}
@keyframes quiltDrift{to{background-position:102px 0}}
@keyframes quiltSeam{50%{border-color:#87bfe8aa;box-shadow:inset 0 0 24px #aa89d41d}}
@keyframes quiltMoon{50%{transform:translate(-7px,-5px) rotate(8deg);border-color:#8fdab03b}}
@keyframes quiltBreathe{0%,100%{transform:translateY(0);box-shadow:inset 0 0 0 6px #aa89d419,0 13px 24px #0006}50%{transform:translateY(-3px);box-shadow:inset 0 0 0 6px #f08fc820,0 18px 31px #0007}}
@keyframes quiltThread{50%{background-position:100% 0}}
@keyframes quiltButton{50%{filter:brightness(1.35);text-shadow:0 0 15px currentColor}}
@keyframes quiltFloat{50%{transform:translateY(-4px);box-shadow:0 13px 31px #0008,0 0 14px #f08fc833}}
@media(max-width:900px){.stage,.mast{padding-inline:16px}.grid{grid-template-columns:1fr}.card.now,.card.cast,.card.bond,.card.chronicle,.card.vault{grid-column:1;min-height:240px}.theme-head{align-items:start;flex-direction:column}.vellum{padding:12px 12px 72px}.floating{right:18px;left:18px;width:auto}.brand{font-size:20px}.windowbar{gap:8px}.tool{width:31px;height:31px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

<body>
<header class="mast"><div class="kicker">VELLUM / Chrome Atelier 10</div><h1>Prismatic Maximalism</h1><p>Ten extension-native theme studies. Every direction uses pink, green, blue, and purple, then assigns a different silhouette to Now, Cast, Bonds, Chronicle, and Vault.</p></header>
<nav class="picker" aria-label="Theme picker"><div class="picker-inner">
<button aria-pressed="true" data-theme="glass">01 Stained Glass</button><button aria-pressed="false" data-theme="rococo">02 Rococo</button><button aria-pressed="false" data-theme="bio">03 Bio-Circuit</button><button aria-pressed="false" data-theme="celestial">04 Celestial</button><button aria-pressed="false" data-theme="aquarium">05 Aquarium</button><button aria-pressed="false" data-theme="carnival">06 Carnival</button><button aria-pressed="false" data-theme="herbarium">07 Herbarium</button><button aria-pressed="false" data-theme="dragon">08 Dragon Court</button><button aria-pressed="false" data-theme="candy">09 Candy Alchemist</button><button aria-pressed="false" data-theme="quilt">10 Dream Quilt</button>
</div></nav>
<main class="stage" id="stage"></main>
<template id="theme-template">
<section class="theme"><header class="theme-head"><div><div class="micro numberline"></div><h2></h2><p class="desc"></p></div><div class="swatches" aria-label="Pink, green, blue, and purple palette"><i></i><i></i><i></i><i></i></div></header>
<div class="vellum"><header class="windowbar"><div class="sealmark"><span>V</span></div><div class="brand">VELLUM</div><button class="tool" aria-label="Choose tab">☷</button><button class="tool" aria-label="Refresh">↻</button><button class="tool" aria-label="Open extension">▣</button></header><div class="tabs"><span>◉ NOW</span><span>♙ CAST</span><span>⌁ BONDS</span><span>▤ CHRONICLE</span><span>✦ VAULT</span></div>
<div class="grid">
<article class="card now"><div class="micro">Now / Scene state</div><h3>The Lantern Gallery</h3><p>Day 12 · 21:14 · rain tracing the eastern windows</p><div class="meta"><span class="chip">Tension 62</span><span class="chip">Private</span><span class="chip">Candlelight</span></div><div class="meter"><i></i></div><p>The letter remains beneath Mara's hand. Nobody in the corridor knows it arrived.</p></article>
<article class="card cast"><div class="micro">Cast / Present</div><div class="castline"><div class="avatar">MV</div><div><h3>Mara Vale</h3><span class="chip">Guarded</span></div></div><p>Still wearing her rain-dark coat. Listening to the footsteps beyond the gallery door.</p><div class="meta"><span class="chip">Resolute</span><span class="chip">Observant</span></div></article>
<article class="card bond"><div class="micro">Bonds / Living relation</div><div class="pair"><span>Mara</span><b>∞</b><span>Rowan</span></div><p>Protective trust complicated by one carefully maintained lie.</p><div class="micro">Trust 76</div><div class="meter"><i></i></div><div class="meta"><span class="chip">Devotion</span><span class="chip">Unsaid</span></div></article>
<article class="card chronicle"><div class="micro">Chronicle / Active thread</div><h3>The unopened letter</h3><ol class="timeline"><li><b>21:08</b> — A courier left the sealed letter with Mara.</li><li><b>21:11</b> — Rowan recognized the wax mark and concealed his reaction.</li><li><b>21:14</b> — Footsteps stopped outside the gallery door.</li></ol></article>
<article class="card vault"><div class="micro">Vault / Verified memory</div><h3>Private archive</h3><div class="folio"><div class="folio-icon">✉</div><div><b>The winter correspondence</b><p>Known by Mara only · direct evidence</p></div></div><div class="folio"><div class="folio-icon">⚿</div><div><b>Gallery service key</b><p>Held by Rowan · functional</p></div></div></article>
</div><div class="floating"><span class="pulse"></span><b>VELLUM · NOW</b><span style="margin-left:auto;color:var(--muted)">21:14 · Gallery</span></div></div>
<p class="legend"></p></section>
</template>
<script>
const themes=[
['glass','01 / Sacred color and leaded light','Stained-Glass Reliquary','Arched chapel scene · shrine cameo · ogee bond plaque · lancet chronicle · reliquary chest'],
['rococo','02 / Pastel porcelain and living ornament','Rococo Conservatory','Shell salon · garden cameo · cartouche duet · ribbon chronicle · porcelain cabinet vault'],
['bio','03 / A machine that remembers','Neon Bio-Circuit','Offset state capsule · biometric cocoon · split neural bond · circuit console · reinforced memory cell'],
['celestial','04 / Myth written in orbit','Celestial Menagerie','Observatory dome · celestial portrait · twin-orbit bond · comet scroll · lunar seal vault'],
['aquarium','05 / An archive beneath the tide','Enchanted Aquarium','Observation dome · pearl-shell cast · tidal bond pool · current scroll · treasure chamber vault'],
['carnival','06 / The living world as spectacle','Carnival of Memories','Bulb-lined marquee · admission cameo · carousel bond · perforated ticket · fortune cabinet vault'],
['herbarium','07 / Pressed evidence and living ink','Arcane Herbarium','Field-note scene · specimen cameo · pressed-leaf bond · offset folio · clasped herbarium vault'],
['dragon','08 / Heraldry forged around state','Prism Dragon Court','Rounded shield scene · scale crest cast · divided heraldic bond · banner chronicle · armored treasure vault'],
['candy','09 / Memory under black light','Candy Alchemist','Reagent vessel · neon specimen capsule · twin-flask bond · reaction rack · stable-compound vault'],
['quilt','10 / Continuity stitched into dreaming cloth','Dream Quilt Palace','Drifting scene patch · portrait locket · joined-seam bond · running-stitch chronicle · breathing memory pocket']];
const stage=document.querySelector('#stage'),template=document.querySelector('#theme-template');
themes.forEach(([id,num,name,legend],index)=>{const node=template.content.cloneNode(true),section=node.querySelector('.theme');section.id=id;section.classList.add(id);if(!index)section.classList.add('active');section.querySelector('.numberline').textContent=num;section.querySelector('h2').textContent=name;section.querySelector('.desc').textContent=legend;section.querySelector('.legend').innerHTML='<strong>Dedicated forms:</strong> '+legend;stage.append(node)});
function show(id){document.querySelectorAll('.theme').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-theme]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.theme===id)));history.replaceState(null,'','#'+id)}
document.querySelectorAll('[data-theme]').forEach(button=>button.addEventListener('click',()=>show(button.dataset.theme)));
const initial=location.hash.slice(1);if(themes.some(x=>x[0]===initial))show(initial);
</script>
